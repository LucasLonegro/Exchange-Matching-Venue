# Private topology for the tools/ end-to-end runs (scripts/smoke-test.sh, load generator).
# Every port is in the tools range 39000-39999 (ARCHITECTURE.md section 7) so a run never clashes with
# deploy/local defaults (20000+, 9100+) or with other modules' test ranges.
# Data: LMB_LOCAL_DATA=tools/target/e2e (set by scripts/smoke-test.sh).
lmb.shards=2
lmb.members=2
lmb.gateways=1
lmb.md.instances=1
lmb.consolidators=1
lmb.controlplane.instances=1

# Shard nodes: basePort + offsets 0..9. Up to 3 members per shard.
lmb.shard.0.member.0.basePort=39000
lmb.shard.0.member.1.basePort=39020
lmb.shard.0.member.2.basePort=39040
lmb.shard.1.member.0.basePort=39100
lmb.shard.1.member.1.basePort=39120
lmb.shard.1.member.2.basePort=39140

lmb.gateway.0.grpcPort=39500
lmb.gateway.0.fixPort=39501
lmb.gateway.0.metricsPort=39502
lmb.gateway.1.grpcPort=39510
lmb.gateway.1.fixPort=39511
lmb.gateway.1.metricsPort=39512

lmb.controlplane.0.restPort=39600
lmb.controlplane.0.metricsPort=39601
lmb.controlplane.1.restPort=39610
lmb.controlplane.1.metricsPort=39611

lmb.md.0.retransmitPort=39700
lmb.md.0.grpcPort=39701
lmb.md.0.metricsPort=39702
lmb.md.1.retransmitPort=39710
lmb.md.1.grpcPort=39711
lmb.md.1.metricsPort=39712
lmb.consolidator.0.metricsPort=39720
lmb.consolidator.1.metricsPort=39721
lmb.feedsim.metricsPort=39730
lmb.posttrade.dropCopyFixPort=39740
lmb.posttrade.metricsPort=39741
lmb.replayer.metricsPort=39750
lmb.ledger.metricsPort=39755
# access service: operators 39760+i, directory 39770+i, metrics 39780+i
lmb.access.adminPort=39760
lmb.access.internalPort=39770
lmb.access.metricsPort=39780

# The local market is open whenever the control plane is up (ignores the calendar).
lmb.controlplane.autoOpen=true
lmb.controlplane.autoOpenDelayMs=500
