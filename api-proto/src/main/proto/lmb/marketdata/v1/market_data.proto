syntax = "proto3";

package lmb.marketdata.v1;

option java_package = "io.lmb.proto.marketdata";
option java_multiple_files = true;

// Conflated streaming market data for participants outside the colo.
// Co-located participants use the binary UDP multicast feed instead.
service MarketData {
  rpc Subscribe(SubscribeRequest) returns (stream MarketDataUpdate);
}

message SubscribeRequest {
  repeated string symbols = 1; // empty = all
  uint32 depth = 2;            // price levels per side in snapshots, 0 = full book
  uint32 conflation_ms = 3;    // 0 = every change; otherwise at most one book update per symbol per interval
}

message PriceLevel {
  int64 price_cents = 1;
  int64 quantity = 2;          // 0 in an incremental removes the level
  int32 order_count = 3;
}

message BookSnapshot {
  repeated PriceLevel bids = 1; // best first
  repeated PriceLevel asks = 2; // best first
  string state = 3;             // SymbolState enum name
  // day-cycle / band-stp: the symbol's state as of md_seq, so a new subscriber does not wait for the next change.
  string state_cause = 4;           // cause of the last SymbolStatus (see SymbolStatus.cause), empty if none
  ReferencePrice reference = 5;     // current reference price and static band; unset if none yet
  ClosingPrice last_close = 6;      // last official close published; unset if none yet
}

message BookIncremental {
  repeated PriceLevel bid_changes = 1;
  repeated PriceLevel ask_changes = 2;
}

message TradePrint {
  int64 match_id = 1;
  int64 price_cents = 2;
  int64 quantity = 3;
  string aggressor_side = 4;   // BUY, SELL or empty for auction trades
  bool auction = 5;
}

message SymbolStatus {
  string state = 1;            // SymbolState enum name
  uint32 reason_code = 2;
  // day-cycle / band-stp: StateChangeCause enum name. COMMAND (operator or schedule), VOLATILITY_INTERRUPTION
  // (the matcher started a volatility auction), VOLATILITY_AUCTION_END (its timer uncrossed it), DAY_ROLLOVER.
  string cause = 3;
}

message AuctionIndicative {
  int64 price_cents = 1;
  bool has_price = 2;
  int64 matched_quantity = 3;
  int64 imbalance_quantity = 4;
  string imbalance_side = 5;
  bool final = 6;
}

// day-cycle / band-stp: the matcher applied a reference price: at DayRollover (the official close), after a
// volatility auction that traded (the uncross price), or by command. Limit prices outside
// [band_low_cents, band_high_cents] are rejected.
message ReferencePrice {
  int64 reference_price_cents = 1;
  bool has_reference_price = 2;
  int64 band_low_cents = 3;
  int64 band_high_cents = 4;
  bool has_band = 5;           // false when the band is not known (e.g. redefined since the last update)
}

// day-cycle / band-stp: official close of trading_date. The last one before a day rollover is the official
// close: positions are marked to it and it becomes the next day's reference price.
message ClosingPrice {
  int64 price_cents = 1;
  bool has_price = 2;          // false when source is NONE
  int64 previous_close_cents = 3;
  bool has_previous_close = 4;
  int32 trading_date = 5;      // yyyymmdd of the trading day being closed, 0 before the first rollover
  string source = 6;           // ClosePriceSource enum name: AUCTION, LAST_TRADE, PREVIOUS_CLOSE or NONE
}

message MarketDataUpdate {
  string symbol = 1;
  uint32 symbol_id = 2;
  // Per-symbol sequence number shared with the multicast feed. A snapshot carries the
  // sequence of the last incremental it includes; discard incrementals at or below it.
  uint64 md_seq = 3;
  int64 transact_time_ns = 4;
  oneof body {
    BookSnapshot snapshot = 5;
    BookIncremental incremental = 6;
    TradePrint trade = 7;
    SymbolStatus status = 8;
    AuctionIndicative auction = 9;
    ReferencePrice reference = 10; // day-cycle / band-stp
    ClosingPrice close = 11;       // day-cycle / band-stp
  }
}
