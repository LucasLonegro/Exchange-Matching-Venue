metadata:
  name: "lmb-fix-tls"
  namespace: "lmb"
data:
  envoy.yaml: "admin:\n  address: {socket_address: {address: 127.0.0.1, port_value: 15201}}\nstatic_resources:\n  listeners:\n    - name: fix_tls\n      address: {socket_address: {address: 0.0.0.0, port_value: 9200}}\n      per_connection_buffer_limit_bytes: 65536\n      filter_chains:\n        - transport_socket:\n            name: envoy.transport_sockets.tls\n            typed_config:\n              \"@type\": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext\n              common_tls_context:\n                tls_params: {tls_minimum_protocol_version: TLSv1_2}\n                tls_certificates:\n                  - certificate_chain: {filename: /etc/lmb/tls/tls.crt}\n                    private_key: {filename: /etc/lmb/tls/tls.key}\n          filters:\n            - name: envoy.filters.network.tcp_proxy\n              typed_config:\n                \"@type\": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy\n                stat_prefix: fix_tls\n                cluster: artio\n                idle_timeout: 600s\n                access_log:\n                  - name: envoy.access_loggers.stdout\n                    typed_config:\n                      \"@type\": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog\n  clusters:\n    - name: artio\n      type: STATIC\n      connect_timeout: 1s\n      load_assignment:\n        cluster_name: artio\n        endpoints:\n          - lb_endpoints:\n              - endpoint: {address: {socket_address: {address: 127.0.0.1, port_value: 9201}}}\n"
