# Envoy in front of the local gateways: REST/JSON -> gRPC (lmb.orderentry.v1.OrderQuery) using the
# descriptor set built by api-proto (mounted at /etc/envoy/lmb-api.pb by docker-compose.yml).
#   GET /v1/symbols, GET /v1/firms/{firm_id}/orders/{cl_ord_id}, GET /v1/sessions/{session_id}
# The gateway checks the x-lmb-api-key header (lmb.gateway.query.requireApiKey); Envoy forwards it.
# Gateways are reached on 127.0.0.1:9100/9101 (host networking); add endpoints if --gateways > 2.
admin:
  address:
    socket_address: {address: 127.0.0.1, port_value: 15000}

static_resources:
  listeners:
    - name: rest
      address:
        socket_address: {address: 127.0.0.1, port_value: 8080}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: rest
                codec_type: AUTO
                route_config:
                  name: local
                  virtual_hosts:
                    - name: lmb
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/"}
                          route:
                            cluster: lmb_gateways
                            timeout: 5s
                            retry_policy:
                              retry_on: "unavailable,reset,connect-failure"
                              num_retries: 2
                http_filters:
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: /etc/envoy/lmb-api.pb
                      services: ["lmb.orderentry.v1.OrderQuery"]
                      convert_grpc_status: true
                      auto_mapping: false
                      print_options:
                        add_whitespace: true
                        always_print_primitive_fields: true
                        always_print_enums_as_ints: false
                        preserve_proto_field_names: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: lmb_gateways
      type: STATIC
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      outlier_detection:
        consecutive_5xx: 3
        base_ejection_time: 5s
      load_assignment:
        cluster_name: lmb_gateways
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: 9100}
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: 9101}
