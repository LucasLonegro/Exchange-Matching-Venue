# GENERATED by deploy/monitoring/render.py from metric-names.env and slo-*.env. Do not edit.
groups:
  - name: "lmb-recording"
    interval: "5s"
    rules:
      - record: "lmb:ack_latency_seconds:p50"
        expr: "max by (shard) (lmb_gateway_ack_latency_ns{quantile=\"p50\"}) * 1e-9"
      - record: "lmb:ack_latency_seconds:p99"
        expr: "max by (shard) (lmb_gateway_ack_latency_ns{quantile=\"p99\"}) * 1e-9"
      - record: "lmb:ack_latency_seconds:p999"
        expr: "max by (shard) (lmb_gateway_ack_latency_ns{quantile=\"p999\"}) * 1e-9"
      - record: "lmb:ack_latency_seconds:max"
        expr: "max by (shard) (lmb_gateway_ack_latency_ns{quantile=\"max\"}) * 1e-9"
      - record: "lmb:service_time_seconds:p50"
        expr: "max by (shard) (lmb_cluster_service_time_ns{quantile=\"p50\"}) * 1e-9"
      - record: "lmb:service_time_seconds:p99"
        expr: "max by (shard) (lmb_cluster_service_time_ns{quantile=\"p99\"}) * 1e-9"
      - record: "lmb:service_time_seconds:p999"
        expr: "max by (shard) (lmb_cluster_service_time_ns{quantile=\"p999\"}) * 1e-9"
      - record: "lmb:service_time_seconds:max"
        expr: "max by (shard) (lmb_cluster_service_time_ns{quantile=\"max\"}) * 1e-9"
      - record: "lmb:md_publish_delay_seconds:p50"
        expr: "max (lmb_marketdata_publish_delay_ns{quantile=\"p50\"}) * 1e-9"
      - record: "lmb:md_publish_delay_seconds:p99"
        expr: "max (lmb_marketdata_publish_delay_ns{quantile=\"p99\"}) * 1e-9"
      - record: "lmb:md_publish_delay_seconds:p999"
        expr: "max (lmb_marketdata_publish_delay_ns{quantile=\"p999\"}) * 1e-9"
      - record: "lmb:md_publish_delay_seconds:max"
        expr: "max (lmb_marketdata_publish_delay_ns{quantile=\"max\"}) * 1e-9"
      - record: "lmb:node_role"
        expr: "max by (shard, member, zone) (lmb_cluster_role)"
      - record: "lmb:shard_leaders"
        expr: "sum by (shard) (lmb_cluster_role == bool 2)"
      - record: "lmb:shard_members_up"
        expr: "sum by (shard) (up{job=\"lmb-node\"})"
      - record: "lmb:elections:changes1h"
        expr: "max by (shard) (changes(lmb_cluster_election_count[1h]))"
      - record: "lmb:replication_lag_bytes"
        expr: "max by (shard) (lmb_cluster_commit_position) - on (shard) group_right max by (shard, member) (lmb_cluster_commit_position)"
      - record: "lmb:event_seq_spread"
        expr: "max by (shard) (lmb_cluster_last_event_seq) - min by (shard) (lmb_cluster_last_event_seq)"
      - record: "lmb:command_rate"
        expr: "max by (shard) (rate(lmb_cluster_commands_applied[1m]))"
      - record: "lmb:shard_utilisation"
        expr: "max by (shard) (rate(lmb_cluster_commands_applied[1m]) * ignoring(quantile) lmb_cluster_service_time_ns{quantile=\"p50\"}) * 1e-9"
      - record: "lmb:snapshots:changes26h"
        expr: "max by (shard) (changes(lmb_cluster_snapshot_count[26h]))"
      - record: "lmb:dr_backup_lag_seconds"
        expr: "max by (shard) (lmb_cluster_backup_lag_seconds)"
      - record: "lmb:gateway_inflight_ratio"
        expr: "max by (shard) (lmb_gateway_inflight_depth) / 4096"
      - record: "lmb:gateway_rejects:rate1m"
        expr: "sum by (reason) (rate(lmb_gateway_rejects_total[1m]))"
      - record: "lmb:feed_gap_ratio:rate5m"
        expr: "sum by (venue) (rate(lmb_feeds_gaps_total[5m])) / clamp_min(sum by (venue) (rate(lmb_feeds_messages_total[5m])), 1e-9)"
      - record: "lmb:feed_venue_stale"
        expr: "max by (venue) (lmb_feeds_venue_stale)"
      - record: "lmb:replay_divergence:increase5m"
        expr: "sum by (shard) (increase(lmb_replayer_divergence_total[5m]))"
      - record: "lmb:replayer_lag_events"
        expr: "max by (shard) (lmb_replayer_lag_events)"
      - record: "lmb:posttrade_sink_lag_events"
        expr: "max by (sink, shard) (lmb_posttrade_sink_lag_events)"
      - record: "lmb:ledger_lag_events"
        expr: "max by (shard) (lmb_cluster_last_event_seq) - on (shard) max by (shard) (lmb_ledger_last_event_seq)"
      - record: "lmb:ledger_restarts:increase15m"
        expr: "sum (increase(lmb_ledger_restarts_total[15m]))"
      - record: "lmb:ledger_up"
        expr: "max (lmb_ledger_up)"
      - record: "lmb:ledger_pending_statement_dates"
        expr: "max (lmb_ledger_pending_statement_dates)"
      - record: "lmb:controlplane_lock_holders"
        expr: "sum (lmb_controlplane_is_leader)"
      - record: "lmb:ptp_offset_seconds:abs"
        expr: "max by (instance) (abs(lmb_host_ptp_offset_ns)) * 1e-9"
