# GENERATED by deploy/monitoring/render.py from metric-names.env and slo-*.env. Do not edit.
groups:
  - name: "lmb-slo-prod"
    rules:
      - alert: "LmbAckLatencyP50High"
        expr: "lmb:ack_latency_seconds:p50 > 0.00005"
        for: "2m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Ack latency p50 above 0.00005s (shard {{ $labels.shard }}): {{ $value | humanizeDuration }}"
          runbook: "docs/operations.md"
      - alert: "LmbAckLatencyP99High"
        expr: "lmb:ack_latency_seconds:p99 > 0.0002"
        for: "2m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Ack latency p99 above 0.0002s (shard {{ $labels.shard }}): {{ $value | humanizeDuration }}"
          runbook: "docs/operations.md"
      - alert: "LmbAckLatencyP999High"
        expr: "lmb:ack_latency_seconds:p999 > 0.001"
        for: "5m"
        labels:
          severity: "page"
          profile: "prod"
        annotations:
          summary: "Ack latency p999 above 0.001s (shard {{ $labels.shard }}): {{ $value | humanizeDuration }}"
          runbook: "docs/operations.md"
      - alert: "LmbMatcherServiceTimeHigh"
        expr: "lmb:service_time_seconds:p99 > 0.00002"
        for: "2m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Matcher p99 time per command high on shard {{ $labels.shard }}"
          runbook: "docs/operations.md"
      - alert: "LmbMarketDataPublishDelayHigh"
        expr: "lmb:md_publish_delay_seconds:p99 > 0.0001"
        for: "2m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Market data publish delay p99 high"
          runbook: "docs/operations.md"
      - alert: "LmbShardNoLeader"
        expr: "lmb:shard_leaders < 1"
        for: "5s"
        labels:
          severity: "page"
          profile: "prod"
        annotations:
          summary: "Shard {{ $labels.shard }} has no leader: no orders are accepted (failover not completing)"
          runbook: "docs/operations.md"
      - alert: "LmbShardMultipleLeaders"
        expr: "lmb:shard_leaders > 1"
        for: "30s"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Shard {{ $labels.shard }}: more than one member reports LEADER (stale partitioned leader?)"
          runbook: "docs/operations.md"
      - alert: "LmbFrequentElections"
        expr: "lmb:elections:changes1h > 2"
        for: "0s"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Shard {{ $labels.shard }} elected leaders {{ $value }} times in an hour"
          runbook: "docs/operations.md"
      - alert: "LmbShardMemberDown"
        expr: "lmb:shard_members_up < 3"
        for: "30s"
        labels:
          severity: "page"
          profile: "prod"
        annotations:
          summary: "Shard {{ $labels.shard }} runs on {{ $value }} members: no further failure tolerated"
          runbook: "docs/operations.md"
      - alert: "LmbLeaderOutsidePreferredZone"
        expr: "lmb:node_role{zone!=\"az-a\"} == 2"
        for: "5m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Leader of shard {{ $labels.shard }} is in {{ $labels.zone }}: steer it back (runbook 4.4)"
          runbook: "docs/operations.md"
      - alert: "LmbReplayDivergence"
        expr: "lmb:replay_divergence:increase5m > 0"
        for: "0s"
        labels:
          severity: "page"
          profile: "prod"
        annotations:
          summary: "Shadow replayer DIVERGED on shard {{ $labels.shard }}: determinism broken, stop and investigate"
          runbook: "docs/operations.md"
      - alert: "LmbEventStreamMembersDisagree"
        expr: "lmb:event_seq_spread > 100000"
        for: "2m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Members of shard {{ $labels.shard }} differ by {{ $value }} events"
          runbook: "docs/operations.md"
      - alert: "LmbReplayerLagging"
        expr: "lmb:replayer_lag_events > 100000"
        for: "5m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Replayer of shard {{ $labels.shard }} is {{ $value }} events behind"
          runbook: "docs/operations.md"
      - alert: "LmbFeedGapRateHigh"
        expr: "lmb:feed_gap_ratio:rate5m > 0.0001"
        for: "5m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Feed gap ratio {{ $value }} for venue {{ $labels.venue }}"
          runbook: "docs/operations.md"
      - alert: "LmbFeedVenueStale"
        expr: "lmb:feed_venue_stale > 0"
        for: "1m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Venue {{ $labels.venue }} excluded from NBBO as stale"
          runbook: "docs/operations.md"
      - alert: "LmbPtpOffsetHigh"
        expr: "lmb:ptp_offset_seconds:abs > 0.00001"
        for: "1m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "PTP offset {{ $value }}s on {{ $labels.instance }}"
          runbook: "docs/operations.md"
      - alert: "LmbPtpOffsetCritical"
        expr: "lmb:ptp_offset_seconds:abs > 0.0001"
        for: "30s"
        labels:
          severity: "page"
          profile: "prod"
        annotations:
          summary: "PTP offset above the regulatory limit on {{ $labels.instance }}"
          runbook: "docs/operations.md"
      - alert: "LmbReplicationLagHigh"
        expr: "lmb:replication_lag_bytes > 1048576"
        for: "30s"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Member {{ $labels.member }} of shard {{ $labels.shard }} is {{ $value | humanize1024 }}B behind"
          runbook: "docs/operations.md"
      - alert: "LmbDrBackupLagHigh"
        expr: "lmb:dr_backup_lag_seconds > 5"
        for: "1m"
        labels:
          severity: "page"
          profile: "prod"
        annotations:
          summary: "DR backup of shard {{ $labels.shard }} is {{ $value }}s behind: that is the current RPO"
          runbook: "docs/operations.md"
      - alert: "LmbGatewayInflightNearFull"
        expr: "lmb:gateway_inflight_ratio > 0.8"
        for: "30s"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Gateway in-flight queue for shard {{ $labels.shard }} at {{ $value | humanizePercentage }}"
          runbook: "docs/operations.md"
      - alert: "LmbShardUtilisationHigh"
        expr: "lmb:shard_utilisation > 0.5"
        for: "10m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Shard {{ $labels.shard }} matcher busy {{ $value | humanizePercentage }}: plan a cutover (runbook 4.7)"
          runbook: "docs/operations.md"
      - alert: "LmbNoRecentSnapshot"
        expr: "lmb:snapshots:changes26h == 0"
        for: "1h"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Shard {{ $labels.shard }} took no snapshot in 26h (recovery would replay a long log)"
          runbook: "docs/operations.md"
      - alert: "LmbPostTradeSinkLag"
        expr: "lmb:posttrade_sink_lag_events > 1000000"
        for: "5m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Post-trade sink {{ $labels.sink }} behind on shard {{ $labels.shard }}"
          runbook: "docs/operations.md"
      - alert: "LmbLedgerLag"
        expr: "lmb:ledger_lag_events > 1000000"
        for: "5m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Ledger {{ $value }} events behind on shard {{ $labels.shard }} (positions and statements stale)"
          runbook: "docs/operations.md"
      - alert: "LmbLedgerRestarting"
        expr: "lmb:ledger_restarts:increase15m > 3"
        for: "0m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Ledger restarted {{ $value }} times in 15m: database down, or stuck on an event it cannot apply (see its log)"
          runbook: "docs/operations.md"
      - alert: "LmbLedgerNotOpen"
        expr: "lmb:ledger_up == 0"
        for: "5m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Ledger process is up but its sink is not open (restart backoff loop)"
          runbook: "docs/operations.md"
      - alert: "LmbLedgerStatementsLate"
        expr: "lmb:ledger_pending_statement_dates > 0"
        for: "30m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "{{ $value }} trading date(s) ended on some shards but not all: daily statements not written"
          runbook: "docs/operations.md"
      - alert: "LmbAccessDirectoryStale"
        expr: "lmb:gateway_access_directory_age_seconds:max > 300"
        for: "1m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "A gateway has not reached the access service for {{ $value | humanizeDuration }}: trading continues on its last snapshot, but new teams, keys and revocations do not reach it"
          runbook: "docs/operations.md"
      - alert: "LmbAccessDown"
        expr: "lmb:access_up == 0 or absent(lmb:access_up)"
        for: "5m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "No access service instance is serving: credential changes are on hold (gateways keep their snapshot)"
          runbook: "docs/operations.md"
      - alert: "LmbAccessServiceTokenRejected"
        expr: "lmb:access_auth_failures:increase15m{listener=\"internal\"} > 0"
        for: "0m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "The access directory refused {{ $value }} polls in 15m: a gateway or post-trade has the wrong service token"
          runbook: "docs/operations.md"
      - alert: "LmbGatewayAuthFailuresHigh"
        expr: "lmb:gateway_auth_failures:rate5m > 1"
        for: "10m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "Gateways refuse {{ $value }} logons/queries per second (wrong or revoked keys, or someone guessing)"
          runbook: "docs/operations.md"
      - alert: "LmbControlPlaneLockHolders"
        expr: "lmb:controlplane_lock_holders != 1"
        for: "1m"
        labels:
          severity: "page"
          profile: "prod"
        annotations:
          summary: "{{ $value }} control plane instances hold the scheduler lock (want exactly 1)"
          runbook: "docs/operations.md"
      - alert: "LmbTargetDown"
        expr: "up{job=~\"lmb-.*\"} == 0"
        for: "1m"
        labels:
          severity: "warning"
          profile: "prod"
        annotations:
          summary: "{{ $labels.job }} {{ $labels.instance }} is not answering /metrics"
          runbook: "docs/operations.md"
