# GENERATED by deploy/monitoring/render.py from metric-names.env and slo-*.env. Do not edit.
groups:
  - name: "lmb-slo-local"
    rules:
      - alert: "LmbAckLatencyP99High"
        expr: "lmb:ack_latency_seconds:p99 > 0.05"
        for: "5m"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Ack latency p99 above 0.05s (shard {{ $labels.shard }}): {{ $value | humanizeDuration }}"
          runbook: "docs/operations.md"
      - alert: "LmbAckLatencyP999High"
        expr: "lmb:ack_latency_seconds:p999 > 0.25"
        for: "5m"
        labels:
          severity: "page"
          profile: "local"
        annotations:
          summary: "Ack latency p999 above 0.25s (shard {{ $labels.shard }}): {{ $value | humanizeDuration }}"
          runbook: "docs/operations.md"
      - alert: "LmbMatcherServiceTimeHigh"
        expr: "lmb:service_time_seconds:p99 > 0.005"
        for: "5m"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Matcher p99 time per command high on shard {{ $labels.shard }}"
          runbook: "docs/operations.md"
      - alert: "LmbShardNoLeader"
        expr: "lmb:shard_leaders < 1"
        for: "10s"
        labels:
          severity: "page"
          profile: "local"
        annotations:
          summary: "Shard {{ $labels.shard }} has no leader: no orders are accepted (failover not completing)"
          runbook: "docs/operations.md"
      - alert: "LmbShardMultipleLeaders"
        expr: "lmb:shard_leaders > 1"
        for: "30s"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Shard {{ $labels.shard }}: more than one member reports LEADER (stale partitioned leader?)"
          runbook: "docs/operations.md"
      - alert: "LmbFrequentElections"
        expr: "lmb:elections:changes1h > 10"
        for: "0s"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Shard {{ $labels.shard }} elected leaders {{ $value }} times in an hour"
          runbook: "docs/operations.md"
      - alert: "LmbShardMemberDown"
        expr: "lmb:shard_members_up < 2"
        for: "15s"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Shard {{ $labels.shard }} runs on {{ $value }} members: no further failure tolerated"
          runbook: "docs/operations.md"
      - alert: "LmbReplayDivergence"
        expr: "lmb:replay_divergence:increase5m > 0"
        for: "0s"
        labels:
          severity: "page"
          profile: "local"
        annotations:
          summary: "Shadow replayer DIVERGED on shard {{ $labels.shard }}: determinism broken, stop and investigate"
          runbook: "docs/operations.md"
      - alert: "LmbEventStreamMembersDisagree"
        expr: "lmb:event_seq_spread > 1000000"
        for: "2m"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Members of shard {{ $labels.shard }} differ by {{ $value }} events"
          runbook: "docs/operations.md"
      - alert: "LmbReplayerLagging"
        expr: "lmb:replayer_lag_events > 1000000"
        for: "5m"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Replayer of shard {{ $labels.shard }} is {{ $value }} events behind"
          runbook: "docs/operations.md"
      - alert: "LmbFeedGapRateHigh"
        expr: "lmb:feed_gap_ratio:rate5m > 0.01"
        for: "5m"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Feed gap ratio {{ $value }} for venue {{ $labels.venue }}"
          runbook: "docs/operations.md"
      - alert: "LmbFeedVenueStale"
        expr: "lmb:feed_venue_stale > 0"
        for: "1m"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Venue {{ $labels.venue }} excluded from NBBO as stale"
          runbook: "docs/operations.md"
      - alert: "LmbReplicationLagHigh"
        expr: "lmb:replication_lag_bytes > 16777216"
        for: "30s"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Member {{ $labels.member }} of shard {{ $labels.shard }} is {{ $value | humanize1024 }}B behind"
          runbook: "docs/operations.md"
      - alert: "LmbGatewayInflightNearFull"
        expr: "lmb:gateway_inflight_ratio > 0.9"
        for: "30s"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Gateway in-flight queue for shard {{ $labels.shard }} at {{ $value | humanizePercentage }}"
          runbook: "docs/operations.md"
      - alert: "LmbShardUtilisationHigh"
        expr: "lmb:shard_utilisation > 0.8"
        for: "10m"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Shard {{ $labels.shard }} matcher busy {{ $value | humanizePercentage }}: plan a cutover (runbook 4.7)"
          runbook: "docs/operations.md"
      - alert: "LmbNoRecentSnapshot"
        expr: "lmb:snapshots:changes26h == 0"
        for: "1h"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Shard {{ $labels.shard }} took no snapshot in 26h (recovery would replay a long log)"
          runbook: "docs/operations.md"
      - alert: "LmbPostTradeSinkLag"
        expr: "lmb:posttrade_sink_lag_events > 1000000"
        for: "5m"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Post-trade sink {{ $labels.sink }} behind on shard {{ $labels.shard }}"
          runbook: "docs/operations.md"
      - alert: "LmbLedgerLag"
        expr: "lmb:ledger_lag_events > 1000000"
        for: "5m"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Ledger {{ $value }} events behind on shard {{ $labels.shard }} (positions and statements stale)"
          runbook: "docs/operations.md"
      - alert: "LmbLedgerRestarting"
        expr: "lmb:ledger_restarts:increase15m > 3"
        for: "0m"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Ledger restarted {{ $value }} times in 15m: database down, or stuck on an event it cannot apply (see its log)"
          runbook: "docs/operations.md"
      - alert: "LmbLedgerNotOpen"
        expr: "lmb:ledger_up == 0"
        for: "2m"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "Ledger process is up but its sink is not open (restart backoff loop)"
          runbook: "docs/operations.md"
      - alert: "LmbLedgerStatementsLate"
        expr: "lmb:ledger_pending_statement_dates > 0"
        for: "30m"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "{{ $value }} trading date(s) ended on some shards but not all: daily statements not written"
          runbook: "docs/operations.md"
      - alert: "LmbControlPlaneLockHolders"
        expr: "lmb:controlplane_lock_holders != 1"
        for: "1m"
        labels:
          severity: "page"
          profile: "local"
        annotations:
          summary: "{{ $value }} control plane instances hold the scheduler lock (want exactly 1)"
          runbook: "docs/operations.md"
      - alert: "LmbTargetDown"
        expr: "up{job=~\"lmb-.*\"} == 0"
        for: "30s"
        labels:
          severity: "warning"
          profile: "local"
        annotations:
          summary: "{{ $labels.job }} {{ $labels.instance }} is not answering /metrics"
          runbook: "docs/operations.md"
